<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Private Dashboard | Germán A. Arias</title><style>:root{--bg:#f5f1e8;--paper:#fbf8f2;--text:#20201e;--muted:#6d6a63;--line:#d7d0c3;--accent:#7b3f2c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.wrap{width:min(1100px,92%);margin:50px auto}h1,h2{font-family:Georgia,serif;font-weight:normal}h1{font-size:3rem}.login,.panel{background:var(--paper);border:1px solid var(--line);padding:25px;margin:20px 0}.login form{display:flex;gap:10px;flex-wrap:wrap}.login input{min-width:260px;padding:11px;font:inherit;border:1px solid var(--line)}button{padding:10px 15px;border:1px solid var(--text);background:var(--text);color:var(--paper);cursor:pointer}.secondary{background:transparent;color:var(--text)}.danger{background:#7d211b}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.stat{padding:18px;border:1px solid var(--line);background:var(--paper)}.stat strong{display:block;font-family:Georgia,serif;font-size:2rem}.site-total strong{font-size:3rem}.comment{border-top:1px solid var(--line);padding:18px 0}.meta{color:var(--accent);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}.message{white-space:pre-wrap;margin:10px 0}.actions{display:flex;gap:8px}.notice{color:var(--accent)}</style></head><body><main class="wrap"><h1>Private Dashboard</h1><p>Website visits, story views and comment moderation. This page requires your private password.</p><section class="login"><form id="login"><input id="password" type="password" placeholder="Administrator password" required><button>Open dashboard</button></form><p class="notice" id="notice"></p></section><div id="dashboard" class="hidden"><section class="panel"><h2>Website visits</h2><div class="stat site-total"><strong id="siteVisits">0</strong>Homepage visits</div></section><section class="panel"><h2>Story views</h2><div class="stats" id="stats"></div></section><section class="panel"><h2>Comments</h2><div id="comments"></div></section></div></main><script>const login=document.querySelector('#login'),notice=document.querySelector('#notice'),dashboard=document.querySelector('#dashboard'),stats=document.querySelector('#stats'),siteVisits=document.querySelector('#siteVisits'),comments=document.querySelector('#comments');let password=sessionStorage.getItem('adminPassword')||'';const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};async function api(path,options={}){const response=await fetch(path,{...options,headers:{'content-type':'application/json','authorization':`Bearer ${password}`,...options.headers}});if(response.status===401)throw new Error('PASSWORD');if(!response.ok)throw new Error('REQUEST');return response.json()}async function load(){notice.textContent='';try{const data=await api('/api/admin/dashboard');sessionStorage.setItem('adminPassword',password);dashboard.classList.remove('hidden');const views=data.views||[];const site=views.find(v=>v.story==='__site__');siteVisits.textContent=site?site.views:0;const stories=views.filter(v=>v.story!=='__site__');stats.innerHTML=stories.map(v=>`<div class="stat"><strong>${v.views}</strong>${esc(v.story)}</div>`).join('')||'<p>No story views recorded yet.</p>';comments.innerHTML=(data.comments||[]).map(c=>`<article class="comment"><div class="meta">${esc(c.story)} · ${esc(c.status)} · ${esc(c.name)}</div><div class="message">${esc(c.message)}</div><div class="actions">${c.status!=='approved'?`<button data-action="approved" data-id="${c.id}">Approve</button>`:'<span>Approved</span>'}<button class="danger" data-action="delete" data-id="${c.id}">Delete</button></div></article>`).join('')||'<p>No comments yet.</p>'}catch(e){dashboard.classList.add('hidden');notice.textContent=e.message==='PASSWORD'?'Incorrect password.':'The dashboard could not be loaded.'}}login.addEventListener('submit',e=>{e.preventDefault();password=document.querySelector('#password').value;load()});comments.addEventListener('click',async e=>{const b=e.target.closest('button[data-action]');if(!b)return;b.disabled=true;try{await api(`/api/admin/comments/${b.dataset.id}`,b.dataset.action==='delete'?{method:'DELETE'}:{method:'PATCH',body:JSON.stringify({status:b.dataset.action})});await load()}catch{notice.textContent='The change could not be saved.'}finally{b.disabled=false}});if(password)load();</script></body></html>
